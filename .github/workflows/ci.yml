name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run build

      - name: Test
        run: npm test
        env:
          # lib/db/supabaseClient.ts constructs its client eagerly at import
          # time, so merely importing lib/dedupe.ts (real, via vi.importActual
          # in tests/ingest.test.ts, or directly in tests/dedupe.test.ts)
          # requires these to be set — even though every test mocks
          # loadExistingIds/insertNewItems and never makes a real Supabase
          # call. Fake, non-secret placeholder values only; Article VI (no
          # live network calls in the automated suite) still holds.
          SUPABASE_URL: https://fake-ci-project.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: fake-ci-service-role-key
          # Phase 3: lib/supabase/client.ts and lib/supabase/server.ts throw
          # eagerly if these aren't set. tests/onboarding/actions.test.ts
          # mocks lib/supabase/server.ts entirely and never hits this path,
          # but applying phase2_handoff.md §3.10's lesson proactively here
          # (same class of "a module throws at import time before any test
          # even runs" bug Phase 2 hit for real) rather than waiting to
          # rediscover it. Fake, non-secret placeholder values only — same
          # Article VI guarantee as above.
          NEXT_PUBLIC_SUPABASE_URL: https://fake-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-ci-anon-key
